# M0035 IC Package — 4-material elastoplastic training config
# Script: train_m0035.py + preprocess_m0035.py
#
# Dataset: 02_abaqus_npz_m0035/  (220 samples)
#   Train: S0001-S0200  (200 samples × 19 steps = 3800 data points)
#   Test:  S0201-S0220
#
# Node features (17D, pre-normalized):
#   disp(3) + prev_vel(3) + stress(6) + peeq(1) + mat_oh(3) + CTE_norm(1)
# Edge features (9D, Multigraph):
#   d_mesh(3) + n_mesh(1) + d_world(3) + n_world(1) + E_elem/E_ref(1)
# Output (10D):
#   vel(3) + stress_next(6) + peeq_next(1)

hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/

# data
preprocess_output_dir: ./04_preprocessed_pt_m0035
train_n: 200

# model
num_input_features: 17
num_edge_features: 9
num_output_features: 10
processor_size: 15
hidden_dim: 256

# loss weights
w_vel: 1.0
w_stress: 1.0
w_peeq: 1.0
stress_every: 1
w_stress_stage1_threshold: 1.0e-3   # w_stress/w_peeq: 0 → 0.5 when vel_loss < this
w_stress_stage2_threshold: 1.0e-4   # w_stress/w_peeq: 0.5 → 1.0 when vel_loss < this

# training
batch_size: 16
epochs: 1000
lr: 0.00004
lr_decay_rate: 0.9999990
input_noise_std: 0.003    # noise in normalized displacement space (σ units)

# performance
use_apex: True
amp: True
num_dataloader_workers: 0
do_concat_trick: False
num_processor_checkpoint_segments: 0
recompute_activation: False

# checkpoints / logging
ckpt_path: "./checkpoints_m0035_h256"
tensorboard_log_dir: ./tensorboard_logs_m0035_h256