# 加 Δx_{t-1}（前一步速度）的版本 — 合成資料（Synthetic）
# 對應 train_prevvel_synthetic.py + generate_synthetic_data_nonlinear_prevvel.py
#
# 與 config_prevvel.yaml（Abaqus 版）的差異：
#   - preprocess_output_dir: 指向合成資料目錄
#   - edge stats 4D（ref 和 world 共用）
#   - compute_edge_features 方向為 src-dst

hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/

# data configs
preprocess_output_dir: ./04_preprocessed_pt_nonlinear_prevvel

# training configs
batch_size: 128
max_nodes: ~               # 合成資料節點數固定（4x4x4=64），不需要過濾
epochs: 5000
num_training_samples: 2000
num_training_time_steps: 21
lr: 0.0002
lr_decay_rate: 0.9999972
lambda_penalty: 0
w_vel: 1.0
w_stress: 0.0
input_noise_std: 0.0001    # 只加在位移部分 (x[:, :3])，不加在 prev_vel 部分
num_input_features: 6      # x_t(3) + prev_vel(3)
num_output_features: 3     # vel(3)
num_edge_features: 8
processor_size: 4
hidden_dim: 64

rollout_train_steps: 1     # 1 = teacher forcing only

# performance configs
use_apex: True
amp: True
jit: False
num_dataloader_workers: 0
do_concat_trick: False
num_processor_checkpoint_segments: 0
recompute_activation: False

# tensorboard configs
tensorboard_log_dir: ./tensorboard_logs_prevvel_synthetic

ckpt_path: "./checkpoints_nonlinear_prevvel"

# test & visualization configs
num_test_samples: 5
num_test_time_steps: 19
viz_vars: ["disp_mag"]
frame_skip: 5
frame_interval: 1
