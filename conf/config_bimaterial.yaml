# Bi-material cantilever beam — Multigraph training config
# Corresponding script: train_bimaterial.py + preprocess_bimaterial.py
#
# Dataset: 02_abaqus_npz_bimaterial/  (1100 samples)
#   Train: indices 0-999   (4 directions × 250 each, round-robin)
#   Test:  indices 1000-1099
#
# Network inputs:
#   node features: 9D = [disp(3), prev_vel(3), node_type_oh(3)]
#   edge features: 9D = [d_mesh(3), n_mesh(1), d_world(3), n_world(1), E_norm(1)]
#   Multigraph: interface nodes have 2 directed edges with different E

hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/

# data
preprocess_output_dir: ./04_preprocessed_pt_bimaterial
train_start: 0
train_end: 1000

# model
num_input_features: 10     # disp(3) + prev_vel(3) + node_type_oh(3) + p_norm(1)
num_edge_features: 9       # d_mesh(3) + n_mesh(1) + d_world(3) + n_world(1) + E_norm(1)
num_output_features: 3     # velocity (3)
processor_size: 4
hidden_dim: 128

# loss weights
w_vel: 1.0
w_stress: 1.0
stress_every: 1            # compute stress loss every step
w_stress_stage1_threshold: 1.0e-3   # w_stress: 0 → 0.5 when vel_loss < this
w_stress_stage2_threshold: 1.0e-4   # w_stress: 0.5 → 1.0 when vel_loss < this

# training
batch_size: 128
epochs: 1000
lr: 0.00004
lr_decay_rate: 0.9999990
input_noise_std: 0.003    # noise level in normalized displacement space (σ units)
rollout_train_steps: 1     # teacher forcing only

# performance
use_apex: True
amp: True
num_dataloader_workers: 0
do_concat_trick: False
num_processor_checkpoint_segments: 0
recompute_activation: False

# checkpoints / logging
ckpt_path: "./checkpoints_bimaterial_v3"
# init_ckpt_path: ""   # fresh start on new dataset
tensorboard_log_dir: ./tensorboard_logs_bimaterial

# inference (unused by train_bimaterial.py, kept for reference)
infer_sample_indices: [1000, 1001, 1002, 1003, 1004]
infer_output_dir: "./infer_output_bimaterial"
