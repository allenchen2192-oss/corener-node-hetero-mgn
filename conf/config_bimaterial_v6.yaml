# Bi-material cantilever beam — v6: strain proxy loss
# Base: v2 architecture (9D input, proc_size=4, no P feature)
# New:  w_strain=0.1 trains on velocity differences between adjacent mesh nodes
#       (equivalent to training displacement gradient at t+1, no E amplification)
# Hypothesis: directly supervising ∇u improves B-matrix stress accuracy
#             without the 14× amplification issue of B-matrix stress loss

hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/

# data
preprocess_output_dir: ./04_preprocessed_pt_bimaterial
train_start: 0
train_end: 1000

# model
num_input_features: 9      # disp(3) + prev_vel(3) + node_type_oh(3)  (no P)
num_edge_features: 9       # d_mesh(3) + n_mesh(1) + d_world(3) + n_world(1) + E_norm(1)
num_output_features: 3     # velocity (3)
processor_size: 4
hidden_dim: 128

# loss weights
w_vel: 1.0
w_stress: 0.0              # no B-matrix stress loss
w_strain: 1.0              # strain proxy: linearly warmed up 0→1 over cfg.epochs
use_p_feature: False

# training
batch_size: 128
epochs: 1000
lr: 0.00004
lr_decay_rate: 0.9999990
input_noise_std: 0.003
rollout_train_steps: 1

# performance
use_apex: True
amp: True
num_dataloader_workers: 0
do_concat_trick: False
num_processor_checkpoint_segments: 0
recompute_activation: False

# checkpoints / logging
ckpt_path: "./checkpoints_bimaterial_v6"
tensorboard_log_dir: ./tensorboard_logs_bimaterial_v6

# inference
infer_sample_indices: [1000, 1001, 1002, 1003, 1004]
infer_output_dir: "./infer_output_bimaterial_v6"
