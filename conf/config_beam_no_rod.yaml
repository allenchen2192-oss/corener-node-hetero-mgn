# 3D Beam bending (無 rod) — prevvel 版本
# t=0 已在 InMemoryTimeStepDataset 中過濾（step_index > 0）
# 訓練資料：t=1 到 t=19（共 18 個 transition per sample）

hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/

# data configs
data_dir: ./raw_dataset/deforming_plate/deforming_plate  # unused but required by hydra
preprocess_output_dir: D:/Allen/Allen_Workspace/beam_data/Abaqus_Beam_Data/04_preprocessed_pt_beam_prevvel

# training configs
batch_size: 128
max_nodes: 2000
epochs: 1000
num_training_samples: 1000   # samples 00000–00999（train），01000–01099（test）
num_training_time_steps: 20  # F=20 frames → 19 transitions，過濾後 18 per sample
lr: 0.00004
lr_decay_rate: 0.9999990
lambda_penalty: 0
w_vel: 1.0
w_stress: 0.5
input_noise_std: 0.0001
use_relative_vel_loss: False  # 已被 per_sample_norm 取代
use_per_sample_norm: True     # 用 prev_vel 大小做 per-sample 正規化（線彈性專用）
num_input_features: 8        # disp(3) + prev_vel(3) + node_type_oh(2)
num_output_features: 3       # vel(3)
num_edge_features: 8         # beam 資料：ref(4D) + world(4D) 在載入時合併為 8D
processor_size: 4
hidden_dim: 128

use_node_type: True

rollout_train_steps: 1       # 純 teacher forcing

# performance configs
use_apex: True
amp: True
jit: False
num_dataloader_workers: 0
do_concat_trick: False
stress_every: 1
num_processor_checkpoint_segments: 0
recompute_activation: False

# tensorboard configs
tensorboard_log_dir: ./tensorboard_logs_3Dbeam_no_rod_stress05_persample_clamp1e6

ckpt_path: "./checkpoints_3Dbeam_no_rod_stress05_persample_clamp1e6"

# inference configs
infer_sample_indices: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009]
infer_output_dir: "./infer_output_3Dbeam_no_rod"
