hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/

# data configs
data_dir: ./raw_dataset/deforming_plate/deforming_plate
preprocess_output_dir: ./04_preprocessed_pt

# training configs
batch_size: 256
epochs: 5000
num_training_samples: 1000
num_training_time_steps: 20
lr: 0.0002
lr_decay_rate: 0.9999972
lambda_penalty: 0
w_vel: 1.0
w_stress: 1.0
input_noise_std: 0.0    # no noise (matches original no-noise experiments)
num_input_features: 3
num_output_features: 4  # model directly predicts velocity(3) + stress(1)
num_edge_features: 8
processor_size: 4
hidden_dim: 64

rollout_train_steps: 1  # 1 = teacher forcing only

# performance configs
use_apex: True
amp: True
jit: False
num_dataloader_workers: 0
do_concat_trick: False
num_processor_checkpoint_segments: 0
recompute_activation: False

# tensorboard configs
tensorboard_log_dir: ./tensorboard_logs

ckpt_path: "./checkpoints_h64_1k_1000data_5000epoch"

# test & visualization configs
num_test_samples: 5
num_test_time_steps: 200
viz_vars: ["disp_mag"]
frame_skip: 20
frame_interval: 1

# inference configs
infer_sample_indices: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009]
