# Case 2: Predict displacement and stress simultaneously (4-output)
# Architecture aligned with v2: 9D input, proc=4, hidden=128, no P feature
# Model outputs: vel(3) + B-matrix_stress_vm(1) — both directly supervised
# Use train_bimaterial_case2.py

hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/

# data
preprocess_output_dir: ./04_preprocessed_pt_bimaterial
train_start: 0
train_end: 1000

# model (same as v2 except 4 outputs)
num_input_features: 9      # disp(3) + prev_vel(3) + node_type_oh(3) — no P
num_edge_features: 9
num_output_features: 4     # vel(3) + stress_vm(1)
processor_size: 4
hidden_dim: 128
use_p_feature: false

# loss — no warmup: direct stress prediction is stable from epoch 0
w_vel: 1.0
w_stress: 1.0              # weight on direct stress prediction MSE

# training (identical to v2)
batch_size: 128
epochs: 1000
lr: 0.00004
lr_decay_rate: 0.9999990
input_noise_std: 0.003

# performance
use_apex: True
amp: True
num_dataloader_workers: 0
do_concat_trick: False
num_processor_checkpoint_segments: 0
recompute_activation: False

# checkpoints / logging
ckpt_path: ./checkpoints_bimaterial_case2
tensorboard_log_dir: ./tensorboard_logs_bimaterial_case2
