# 加 Δx_{t-1}（前一步速度）的版本
# 對應 train_prevvel.py + generate_synthetic_data_nonlinear_prevvel.py

hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/

# data configs
data_dir: ./raw_dataset/deforming_plate/deforming_plate
preprocess_output_dir: ./04_preprocessed_pt_abaqus_prevvel

# training configs
batch_size: 128
max_nodes: 1000
epochs: 1000
num_training_samples: 1000
num_training_time_steps: 20
lr: 0.00004
lr_decay_rate: 0.9999990
lambda_penalty: 0
w_vel: 1.0
w_stress: 0.5
input_noise_std: 0.0001   # 只加在位移部分 (x[:, :3])，不加在 prev_vel 部分
num_input_features: 8     # x_t(3) + prev_vel(3) + node_type_oh(2)
num_output_features: 3    # vel(3)
num_edge_features: 8
processor_size: 4
hidden_dim: 128

rollout_train_steps: 1    # 1 = teacher forcing only

# performance configs
use_apex: True
amp: True
jit: False
num_dataloader_workers: 0
do_concat_trick: False
stress_every: 1        # compute stress loss every N steps (reduces overhead)
num_processor_checkpoint_segments: 0
recompute_activation: False

# tensorboard configs
tensorboard_log_dir: ./tensorboard_logs_prevvel

ckpt_path: "./checkpoints_abaqus_prevvel_1000data_1000nodes_h128_gfdm_stress_nodetype_dispnorm"

# test & visualization configs
num_test_samples: 5
num_test_time_steps: 200
viz_vars: ["disp_mag"]
frame_skip: 20
frame_interval: 1

# inference configs
infer_sample_indices: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
infer_output_dir: "./infer_output_prevvel"
