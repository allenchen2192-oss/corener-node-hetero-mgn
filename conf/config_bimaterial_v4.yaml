# Bi-material cantilever beam — v4 ablation: no P feature
# Same as v3 except use_p_feature=False and num_input_features=9
#
# Hypothesis: P feature hurts stress accuracy by providing a global-scale shortcut
# that degrades local displacement gradient learning (needed for GFDM stress).

hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/

# data
preprocess_output_dir: ./04_preprocessed_pt_bimaterial
train_start: 0
train_end: 1000

# model
num_input_features: 9      # disp(3) + prev_vel(3) + node_type_oh(3)  — no p_norm
num_edge_features: 9       # d_mesh(3) + n_mesh(1) + d_world(3) + n_world(1) + E_norm(1)
num_output_features: 3     # velocity (3)
processor_size: 4
hidden_dim: 128

# P feature flag
use_p_feature: false       # ablation: remove P scalar from node input

# loss weights
w_vel: 1.0
w_stress: 1.0
stress_every: 1
w_stress_stage1_threshold: 1.0e-3
w_stress_stage2_threshold: 1.0e-4

# training
batch_size: 128
epochs: 1000
lr: 0.00004
lr_decay_rate: 0.9999990
input_noise_std: 0.003    # normalized-space noise (same as v3)
rollout_train_steps: 1

# performance
use_apex: True
amp: True
num_dataloader_workers: 0
do_concat_trick: False
num_processor_checkpoint_segments: 0
recompute_activation: False

# checkpoints / logging
ckpt_path: "./checkpoints_bimaterial_v4"
tensorboard_log_dir: ./tensorboard_logs_bimaterial

# inference
infer_sample_indices: [1000, 1001, 1002, 1003, 1004]
infer_output_dir: "./infer_output_bimaterial_v4"