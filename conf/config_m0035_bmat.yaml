# M0035 IC Package — B-matrix stress for elastic materials
# Script: train_m0035_bmat.py
#
# Si/UF stress is computed from vel_pred via B-matrix (no direct stress prediction).
# Solder stress + PEEQ predicted directly as before.
# No constitutive consistency loss needed — self-consistency is structural.

hydra:
  job:
    chdir: True
  run:
    dir: ./outputs_m0035_bmat/

# data
preprocess_output_dir: ./04_preprocessed_pt_m0035
topo_dir:              ./04_preprocessed_pt_m0035_constloss   # reuse existing topo files

train_n: 200

# model
num_input_features: 17
num_edge_features: 9
num_output_features: 10
processor_size: 15
hidden_dim: 256

# loss weights
w_vel: 1.0
w_stress_el: 0.01    # B-matrix elastic path only
w_stress_so: 0.0     # Solder direct stress: disabled — conflicts with B-matrix + vel
w_peeq: 0.0          # PEEQ: disabled — depends on solder stress being meaningful
stress_every: 1
w_stress_stage1_threshold: 1.0e-3
w_stress_stage2_threshold: 1.0e-4

# training
batch_size: 16
epochs: 1000
lr: 0.00004
lr_decay_rate: 0.9999990
input_noise_std: 0.003

# performance
use_apex: True
amp: True
num_dataloader_workers: 0
do_concat_trick: False
num_processor_checkpoint_segments: 0
recompute_activation: False

# checkpoints / logging
ckpt_path: "./checkpoints_m0035_bmat"
# init_ckpt_path: "./checkpoints_m0035_h256_ep700_init"   # optional warm-start
tensorboard_log_dir: ./tensorboard_logs_m0035_bmat