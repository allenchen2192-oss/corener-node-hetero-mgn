# Bi-material cantilever beam — Bipartite Heterogeneous GNN (Hasse Graph Trick)
# Two node types: corner nodes (velocity) + element nodes (von Mises stress)
# B_{0,2} edges connect node↔element, enabling direct element-level stress prediction
# and avoiding the interface GT averaging problem of node-level stress.

hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/

# data
preprocess_output_dir: ./04_preprocessed_pt_bimaterial
raw_data_dir: ./02_abaqus_npz_bimaterial
train_start: 0
train_end: 1000

# model
num_node_features: 9      # disp(3) + prev_vel(3) + node_type_oh(3)  [normalized]
num_edge_features: 8      # d_mesh(3) + n_mesh(1) + d_world(3) + n_world(1)  [E_norm dropped]
num_elem_features: 3      # mat_type(1) + E_norm(1) + prev_stress(1)  [teacher forcing]
num_node_outputs: 3       # velocity (3)
processor_size: 4
hidden_dim: 128

# element E normalization: min-max over global E range from generate_bimaterial_beam.py
# E_norm = (E - elem_E_min) / (elem_E_max - elem_E_min) → [0, 1]
# UF (E=70 GPa): (70-50)/(200-50) ≈ 0.133  (fixed across all samples)
# Si (E=50~200 GPa): 0.0 ~ 1.0             (varies per sample)
elem_E_min: 50.0e9        # E2_MIN from generate_bimaterial_beam.py
elem_E_max: 200.0e9       # E2_MAX from generate_bimaterial_beam.py

# loss weights
w_vel: 1.0
w_stress: 1.0             # element-level stress loss (avoids interface GT problem)

# training
batch_size: 128
epochs: 1000
lr: 0.00004
lr_decay_rate: 0.9999990
input_noise_std: 0.003    # normalized-space displacement noise (same as existing pipeline)

# performance
amp: True
num_dataloader_workers: 4

# checkpoints / logging
ckpt_path: "./checkpoints_bimaterial_hetero"
ckpt_interval: 50
tensorboard_log_dir: ./tensorboard_logs_bimaterial_hetero

# inference
infer_sample_indices: [1000, 1001, 1002, 1003, 1004]
infer_output_dir: "./infer_output_bimaterial_hetero"
